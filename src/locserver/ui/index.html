<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Portal server</title>
<!-- Monitoring panel of the localisation server. One self-contained file: no build step, nothing
     loaded from the internet. Data: GET /monitor/state, /monitor/feed, /monitor/map/{id} (polled); once per room:
     GET /maps/{id}/model (3D view, WebGL) and /maps/{id} (scan quality). The door is saved with PUT /maps/{id}/anchors/portal. -->
<style>
:root {
  color-scheme: light;
  --bg: #f3f2ee; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --line: #e1e0d9;
  --accent: #2a78d6; --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
  --door: #e8590c;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --line: #2c2c2a;
    --accent: #3987e5; --good-text: #0ca30c; --door: #ff7a1a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --line: #2c2c2a;
  --accent: #3987e5; --good-text: #0ca30c; --door: #ff7a1a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .sub { color: var(--ink2); }
header .grow { flex: 1; }
button, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
main { padding: 12px 16px 24px; display: grid; gap: 12px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); margin: 0 0 8px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.card h2 .grow { flex: 1; }
.card h2 label, .card h2 select, .card h2 button { text-transform: none; letter-spacing: 0; font-weight: 400; }
.c12 { grid-column: span 12; } .c7 { grid-column: span 7; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c4 { grid-column: span 4; } .c8 { grid-column: span 8; }
@media (max-width: 1100px) { .c7, .c5, .c6, .c4, .c8 { grid-column: span 12; } }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 600; color: var(--ink2); font-size: 11.5px; padding: 3px 14px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 4px 14px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.pick { cursor: pointer; } tr.pick:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
tr.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .ink2 { color: var(--ink2); }
.mono { font-family: Consolas, "Cascadia Mono", ui-monospace, monospace; font-size: 12px; }
.empty { color: var(--muted); padding: 10px 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip i { font-style: normal; font-weight: 700; width: 1em; text-align: center; }
.good i { color: var(--good); } .warning i { color: var(--warning); } .serious i { color: var(--serious); } .critical i { color: var(--critical); } .idle i { color: var(--muted); } .info i { color: var(--accent); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; }
.kv dt { color: var(--ink2); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 900px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.step { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.step .t { font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
.step .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.step .d { color: var(--ink2); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.step.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.step.problem { border-color: var(--critical); }
.next { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 0 6px 6px 0; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 4px 0 2px; }
.bar > div { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
.job { padding: 6px 0; border-bottom: 1px solid var(--line); } .job:last-child { border-bottom: 0; }
.job .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.job > .chip { display: flex; align-items: baseline; white-space: normal; overflow-wrap: anywhere; }
.log { height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.log .ln { display: grid; grid-template-columns: 84px 118px minmax(70px, 150px) 1fr; gap: 8px; padding: 1.5px 0; border-bottom: 1px dotted var(--line); }
.log .ln.req { grid-template-columns: 84px minmax(70px, 150px) 1fr 40px 70px; }
.log .ln > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .ln .msg { white-space: normal; overflow-wrap: anywhere; }
.log .ln.error .msg { color: var(--critical); }
.url { display: flex; gap: 8px; align-items: center; }
.planwrap { position: relative; }
canvas { display: block; width: 100%; height: 440px; border: 1px solid var(--line); border-radius: 6px; cursor: grab; touch-action: none; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--muted); border-radius: 6px; padding: 5px 8px; font-size: 12px; max-width: 260px; display: none; z-index: 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink2); font-size: 12px; margin-top: 6px; align-items: center; }
.legend svg { vertical-align: -2px; margin-right: 4px; }
#status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--surface); border-left: 6px solid var(--muted); }
#status .big { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
#status .big i { font-style: normal; color: var(--muted); }
#status .facts { display: flex; flex-wrap: wrap; gap: 4px 22px; color: var(--ink2); align-items: center; }
#status .facts b { color: var(--ink); font-weight: 600; }
#status .facts .mono { color: var(--ink); font-weight: 600; }
#status.up { border-left-color: var(--good); } #status.up .big i { color: var(--good); }
#status.down { border-left-color: var(--critical); background: color-mix(in srgb, var(--critical) 9%, var(--surface)); } #status.down .big i { color: var(--critical); }
#status.wait .big i { animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .25; } }
[hidden] { display: none !important; }
#gl { cursor: grab; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.note3d { color: var(--ink2); margin-top: 6px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 6px; }
.tools .grow { flex: 1; }
.tools label { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.tools input[type=number] { width: 66px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 5px; }
.tools input[type=range] { width: 150px; max-width: 40vw; accent-color: var(--door); }
.doored { border: 1px solid var(--door); border-left-width: 4px; border-radius: 8px; padding: 8px 10px; }
.scanq { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.scanq .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 4px; }
.scanq .issue { margin: 4px 0 0; padding-left: 10px; border-left: 3px solid var(--warning); }
.scanq .kv { margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>AR Portal &middot; localization server</h1>
  <span class="sub" id="hdr">connecting&hellip;</span>
  <span class="grow"></span>
  <span class="chip idle" id="live"><i>&#9679;</i><span>live</span></span>
  <button id="theme" title="Switch between light and dark">Theme</button>
</header>
<div id="status" class="wait">
  <div class="big"><i>&#9679;</i><span id="st-title">Connecting to the server&hellip;</span></div>
  <div class="facts" id="st-facts"></div>
</div>
<main>
  <section class="card c12">
    <h2>How it is used &mdash; where things stand <span class="grow"></span><span class="muted" id="flowdev" style="text-transform:none;letter-spacing:0;font-weight:400"></span></h2>
    <div class="flow" id="flow"></div>
    <div class="next" id="next"></div>
  </section>

  <section class="card c4">
    <h2>Server</h2>
    <dl class="kv" id="server"></dl>
  </section>
  <section class="card c8">
    <h2>Devices <span class="grow"></span><span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">click a row to filter the log</span></h2>
    <div id="devices"></div>
  </section>

  <section class="card c5">
    <h2>Maps</h2>
    <div id="maps"></div>
    <h2 style="margin-top:14px">Jobs</h2>
    <div id="jobs"></div>
  </section>
  <section class="card c7">
    <h2>Room plan <select id="mapsel" title="Map to show"></select><span class="grow"></span>
      <button id="vtop" class="on">Top view</button><button id="v3d">3D</button></h2>
    <div class="planwrap"><canvas id="plan"></canvas><canvas id="gl" hidden></canvas><div class="tip" id="tip"></div></div>
    <div class="note3d" id="note3d" hidden></div>
    <div class="tools" id="tools3d" hidden>
      <button id="vreset" title="Look at the whole room again">Reset view</button>
      <label title="Hide the surfaces near the ceiling so one looks into the room from above"><input type="checkbox" id="cutceil" checked> cut away the ceiling</label>
      <span class="grow"></span>
      <button id="dedit">Edit door</button>
    </div>
    <div class="tools doored" id="doored" hidden>
      <b>Door</b>
      <label title="Turn the door about the vertical">turn <input type="range" id="dyaw" min="-180" max="180" step="1"><input type="number" id="dyawn" min="-180" max="180" step="1">&deg;</label>
      <button id="dwall" title="Turn the door so that it faces the room like the nearest wall">turn to the nearest wall</button>
      <label>width <input type="number" id="dw" min="0.3" max="6" step="0.05"> m</label>
      <label>height <input type="number" id="dh" min="0.3" max="6" step="0.05"> m</label>
      <div class="mono ink2" id="dnums" style="flex-basis:100%"></div>
      <button id="dsave" class="primary">Save</button><button id="dcancel">Cancel</button>
      <span id="dmsg" class="ink2"></span>
    </div>
    <div class="legend" id="legend"></div>
    <div class="ink2" id="plansum" style="margin-top:6px"></div>
    <div class="scanq" id="scanq" hidden></div>
  </section>

  <section class="card c12">
    <h2>Localizations</h2>
    <div id="locs"></div>
  </section>

  <section class="card c6">
    <h2>Device log <select id="devsel"><option value="">all devices</option></select>
      <select id="lvl"><option value="debug">all levels</option><option value="info" selected>info and above</option><option value="warn">warnings and errors</option><option value="error">errors only</option></select>
      <span class="grow"></span><button id="clr1">Clear</button></h2>
    <div class="log mono" id="dlog"></div>
  </section>
  <section class="card c6">
    <h2>Server requests <label><input type="checkbox" id="hidepolls" checked> hide polls</label><span class="grow"></span><button id="clr2">Clear</button></h2>
    <div class="log mono" id="rlog"></div>
  </section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = String(text); return e; }
function chip(kind, icon, label) { const c = el("span", "chip " + kind); c.append(el("i", "", icon), el("span", "", label)); return c; }
const fmtTime = ms => { const d = new Date(ms); return d.toLocaleTimeString("en-GB") + "." + String(d.getMilliseconds()).padStart(3, "0"); };
const dur = s => s < 90 ? Math.round(s) + " s" : s < 5400 ? Math.round(s / 60) + " min" : (s / 3600).toFixed(1) + " h";
const num = (v, d = 0) => v === null || v === undefined ? "–" : Number(v).toFixed(d);
const cm = m => (m * 100).toFixed(m < 0.1 ? 1 : 0) + " cm";

let S = null, selMap = null, pickedMap = false, selDev = "", mapData = null, mapKey = "", lastFeed = 0;
const devEntries = [], reqEntries = [], MAXLOG = 1500;

// ---------------------------------------------------------------- theme
$("theme").onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("locserver-theme", document.documentElement.dataset.theme); } catch (e) {}
  drawPlan();
};
try { const t = localStorage.getItem("locserver-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

// ---------------------------------------------------------------- render: flow, server, devices
const STEP_ICON = { done: ["good", "✓", "done"], active: ["info", "●", "now"], todo: ["idle", "○", "to do"], problem: ["critical", "✕", "needs attention"] };
function renderFlow(f) {
  const box = $("flow"); box.replaceChildren();
  f.steps.forEach((s, i) => {
    const d = el("div", "step " + s.status), t = el("div", "t");
    const ic = STEP_ICON[s.status] || STEP_ICON.todo;
    t.append(el("span", "n", (i + 1) + "."), el("span", "", s.title));
    d.append(t, chip(ic[0], ic[1], ic[2]), el("div", "d", s.detail || ""));
    box.append(d);
  });
  $("next").replaceChildren(el("b", "", "Next: "), document.createTextNode(f.next));
  $("flowdev").textContent = (f.device_id ? "device " + f.device_id : "no device") + (f.map_id ? " · map " + f.map_id : "") + (f.device_step ? " · app step: " + f.device_step : "");
}
function kv(dl, k, v) { const dd = el("dd"); if (v instanceof Node) dd.append(v); else dd.textContent = v; dl.append(el("dt", "", k), dd); }
function renderServer(s) {
  $("hdr").textContent = s.name + " · v" + s.version + " · up " + dur(s.uptime_s);
  const dl = $("server"); dl.replaceChildren();
  kv(dl, "Name", s.name);
  kv(dl, "Version", s.version + "  (API " + s.api_version + ", revision " + s.api_revision + ")");
  kv(dl, "Compute", s.device === "cuda" ? "GPU: " + s.device_name : "CPU only (" + s.device_name + ")");
  if (s.vram_mb) kv(dl, "GPU memory", s.vram_mb.allocated + " MB in use, peak " + s.vram_mb.peak + " MB");
  if (s.localize) kv(dl, "Phones in line", (s.localize.running ? "1 being served, " : "none being served, ") + s.localize.waiting + " waiting"
    + (s.localize.recent_wait_ms != null ? "; lately a request waited " + Math.round(s.localize.recent_wait_ms) + " ms (longest "
      + Math.round(s.localize.recent_wait_ms_longest) + " ms)" : ""));
  kv(dl, "Processor", (s.cpu || "?") + " · " + s.cpu_count + " threads");
  kv(dl, "System", s.os);
  kv(dl, "Running for", dur(s.uptime_s));
  const urls = el("div");
  if (!s.urls.length) urls.append(chip("critical", "✕", "no LAN address - the PC is not on a network"));
  s.urls.forEach(u => { const r = el("div", "url"); const b = el("button", "", "Copy"); b.onclick = () => navigator.clipboard && navigator.clipboard.writeText(u); r.append(el("span", "mono", u), b); urls.append(r); });
  kv(dl, "Reachable at", urls);
  kv(dl, "Models", s.models.extractor + " + " + s.models.matcher);
  const sl = s.stalls;
  if (sl) kv(dl, "Stalls", sl.count ? chip("warning", "▲", sl.count + (sl.count === 1 ? " stall" : " stalls") + ", longest " + sl.longest_s + " s (see " + (sl.report || "the server log") + ")")
    : chip("good", "✓", "none: always answered within " + sl.limit_s + " s"));
}
function renderDevices(list) {
  const box = $("devices");
  if (!list.length) { box.replaceChildren(el("div", "empty", "No device has contacted the server yet. Start the app on a phone in the same Wi-Fi network and enter one of the addresses on the left.")); return; }
  const t = el("table"), h = el("tr");
  ["State", "Device", "Role", "Address", "Last seen", "Server", "Latency", "App step", "Tracking", "Requests", "Errors", ""].forEach((x, i) => h.append(el("th", i >= 5 && i <= 6 || i >= 9 ? "num" : "", x)));
  t.append(h);
  list.forEach(d => {
    const r = el("tr", "pick" + (d.device_id === selDev ? " sel" : ""));
    r.onclick = () => { selDev = selDev === d.device_id ? "" : d.device_id; $("devsel").value = selDev; renderDevices(S.devices); rebuildLogs(); };
    const st = el("td"); st.append(d.online ? chip("good", "●", "online") : chip("serious", "○", "lost"));
    const name = el("td"); name.append(el("div", "", d.name || (d.identified ? d.device_id : "unnamed client")), el("div", "muted", d.device_id + (d.app_version ? " · app " + d.app_version : "")));
    const stt = d.state || {};
    const role = el("td"); role.append(d.role ? chip(d.role === "staff" ? "info" : "idle", d.role === "staff" ? "◆" : "◇", d.role) : "–");
    role.title = d.role === "staff" ? "Staff mode: scans rooms and places the door" : d.role === "visitor" ? "Visitor mode: gets room and door from the server" : "The app did not say which mode it is in (header X-Device-Role)";
    r.append(st, name, role, el("td", "mono", d.address || "–"), el("td", "", d.online ? d.last_seen_age_s.toFixed(1) + " s ago" : dur(d.last_seen_age_s) + " ago"),
      el("td", "num", num(d.server_ms, 1) + " ms"), el("td", "num", d.rtt_ms === null ? "–" : num(d.rtt_ms) + " ms"),
      el("td", "", stt.step || "–"), el("td", "", stt.tracking || "–"), el("td", "num", d.requests), el("td", "num", d.errors));
    const fg = el("td", "num");
    if (!d.online) { const b = el("button", "", "Forget"); b.title = "Remove this device from the list (its log file on disk stays)"; b.onclick = ev => { ev.stopPropagation(); if (selDev === d.device_id) selDev = ""; fetch("/monitor/forget/" + encodeURIComponent(d.device_id), { method: "POST" }); }; fg.append(b); }
    r.append(fg);
    r.title = (d.last_request || "") + (stt.detail ? "\n" + stt.detail : "") + (d.clock_offset_ms !== null ? "\nclock offset " + d.clock_offset_ms + " ms" : "");
    t.append(r);
  });
  box.replaceChildren(t);
  const sel = $("devsel"), have = new Set([...sel.options].map(o => o.value));
  list.forEach(d => { if (!have.has(d.device_id)) { const o = el("option", "", d.name || d.device_id); o.value = d.device_id; sel.append(o); } });
  sel.value = selDev;
}

// ---------------------------------------------------------------- render: maps, jobs, localizations
const ROOM = { ok: ["good", "✓", "plan ok"], partial: ["warning", "▲", "partial plan"], unavailable: ["idle", "○", "no plan"] };
function renderMaps(maps) {
  const box = $("maps");
  if (!maps.length) { box.replaceChildren(el("div", "empty", "No map yet. A map appears here when the app has uploaded a room recording and the build has finished.")); return; }
  const t = el("table"), h = el("tr");
  ["Room", "Images", "3D points", "Room plan", "Door"].forEach((x, i) => h.append(el("th", i === 1 || i === 2 ? "num" : "", x)));
  t.append(h);
  maps.forEach(m => {
    const r = el("tr", "pick" + (m.map_id === selMap ? " sel" : "")); r.onclick = () => { selMap = m.map_id; pickedMap = true; $("mapsel").value = selMap; renderMaps(S.maps); loadMap(true); };
    const id = el("td"); id.append(el("div", "", m.label || m.map_id), el("div", "muted", m.map_id + (m.metric ? " · metric" : " · no scale")));
    const rp = el("td"); const rs = ROOM[m.room_status] || ROOM.unavailable; rp.append(chip(rs[0], rs[1], rs[2]));
    const po = el("td"), sz = m.portal_size ? " " + m.portal_size[0].toFixed(2) + " × " + m.portal_size[1].toFixed(2) + " m" : "";
    po.append(m.portal_source === "manual" ? chip("good", "✓", "staff door" + sz) : m.portal_source === "selected" ? chip("good", "✓", "chosen doorway" + sz)
      : m.portal_source === "auto" ? chip("warning", "▲", "suggested only") : chip("serious", "○", "no door"));
    po.title = m.portal_source === "auto" ? "The server found a doorway, but no staff member has placed or confirmed the door: visitors get no door" : m.portal_source === "none" ? "No door: a staff member has to place it in the app" : "";
    r.append(id, el("td", "num", m.num_images), el("td", "num", m.num_points3D === null ? "–" : m.num_points3D), rp, po); t.append(r);
  });
  box.replaceChildren(t);
  const sel = $("mapsel"); const want = maps.map(m => m.map_id).join("|");
  if (sel.dataset.k !== want) { sel.replaceChildren(); maps.forEach(m => { const o = el("option", "", m.map_id); o.value = m.map_id; sel.append(o); }); sel.dataset.k = want; }

      cam.t = Vc.add(cam.t, Vc.add(Vc.mul(ray.r, -(e.clientX - drag.x) * k), Vc.mul(ray.up, (e.clientY - drag.y) * k))); drag.x = e.clientX; drag.y = e.clientY;
    }
    draw3dSoon();
  });
  const end = () => { drag = null; cv.style.cursor = "grab"; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  cv.addEventListener("wheel", e => { if (!show3d()) return; e.preventDefault(); cam.dist = Math.max(0.3, Math.min(200, cam.dist * (e.deltaY < 0 ? 0.89 : 1.12))); draw3dSoon(); }, { passive: false });
  $("vreset").onclick = () => { resetCam(); draw3dSoon(); };
  $("cutceil").onchange = draw3dSoon;
})();

// ---------------------------------------------------------------- door editing (saved with PUT /maps/{id}/anchors/portal)
function startEdit() {
  if (!show3d()) return;
  const D = doorNow(), F = hf(), sc = scaleM();
  if (D) ED = { p: D.p.slice(), yaw: yawOf(F, D.n), w: +(D.w * sc).toFixed(3), h: +(D.h * sc).toFixed(3), placed: false };
  else {  // a new door in front of the view's centre, on the floor, facing the viewer
    const p = Vc.add(cam.t, Vc.mul(F.u, floorH(F) - Vc.dot(cam.t, F.u)));
    ED = { p, yaw: yawOf(F, Vc.sub(camEye(F), cam.t)), w: 0.9, h: 2.0, placed: true };
  }
  ED.map = selMap; ED.orig = { p: ED.p.slice(), yaw: ED.yaw, w: ED.w, h: ED.h };
  $("dmsg").textContent = ""; syncEdit(true); drawPlan();
}
function endEdit() { ED = null; $("doored").hidden = true; $("dmsg").textContent = ""; syncEdit(); draw3dSoon(); }
function syncEdit(fields) {  // the numbers under the view (and the fields, unless the user is typing in one)
  const b = $("dedit"), po = mapData && mapData.portal;
  b.textContent = ED ? "Stop editing" : po && po.position && po.source !== "none" ? "Edit door" : "Place door";
  b.classList.toggle("on", !!ED);
  if (!ED) return;
  const F = hf(), sc = scaleM(), dy = deg(ED.yaw);
  if (fields || document.activeElement !== $("dyawn")) $("dyawn").value = dy.toFixed(0);
  $("dyaw").value = dy.toFixed(0);
  if (fields) { $("dw").value = ED.w; $("dh").value = ED.h; }
  const moved = Math.hypot(...Vc.sub(ED.p, ED.orig.p)) * sc, above = (Vc.dot(ED.p, F.u) - floorH(F)) * sc;
  $("dnums").textContent = "position " + ED.p.map(v => v.toFixed(3)).join(", ") + (sc !== 1 ? " (map units)" : " m") + " · yaw " + dy.toFixed(1) + "° · " + ED.w.toFixed(2) + " × " + ED.h.toFixed(2) + " m" +
    " · bottom " + (above >= 0 ? "+" : "") + (above * 100).toFixed(1) + " cm from the floor · " + (ED.placed ? "new door" : "moved " + (moved * 100).toFixed(0) + " cm, turned " + deg(ED.yaw - ED.orig.yaw).toFixed(1) + "°");
  draw3dSoon();
}
$("dedit").onclick = () => ED ? endEdit() : startEdit();
$("dcancel").onclick = endEdit;
$("dyaw").oninput = () => { if (ED) { ED.yaw = +$("dyaw").value * Math.PI / 180; syncEdit(); } };
$("dyawn").oninput = () => { const v = parseFloat($("dyawn").value); if (ED && isFinite(v)) { ED.yaw = v * Math.PI / 180; syncEdit(); } };
["dw", "dh"].forEach(id => $(id).oninput = () => {
  const v = parseFloat($(id).value), ok = isFinite(v) && v >= 0.3 && v <= 6;
  $(id).style.borderColor = ok ? "" : "var(--critical)"; if (ED && ok) { ED[id === "dw" ? "w" : "h"] = v; syncEdit(); }
});
$("dwall").onclick = () => {  // face the room like the nearest wall (its normal points into the room)
  if (!ED) return;
  const F = hf(), flat = v => [Vc.dot(v, F.r0), Vc.dot(v, F.r90)], p = flat(ED.p); let best = null, bd = 1e9;
  mapData.room.walls.forEach(w => {
    const a = flat(w.corners[0]), b = flat(w.corners[1]), ab = [b[0] - a[0], b[1] - a[1]], L = ab[0] ** 2 + ab[1] ** 2 || 1;
    const s = Math.max(0, Math.min(1, ((p[0] - a[0]) * ab[0] + (p[1] - a[1]) * ab[1]) / L)), d = Math.hypot(a[0] + s * ab[0] - p[0], a[1] + s * ab[1] - p[1]);
    if (d < bd) { bd = d; best = w; }
  });
  if (!best) { $("dmsg").textContent = "this room plan has no walls"; return; }
  ED.yaw = yawOf(F, best.normal); $("dmsg").textContent = "turned like wall " + best.id + " (" + (bd * scaleM()).toFixed(2) + " m away)"; syncEdit(true);
};
$("dsave").onclick = async () => {
  if (!ED) return;
  const F = hf(), n = hdir(F, ED.yaw), id = ED.map;
  const body = { position: ED.p.map(v => +v.toFixed(4)), quaternion_xyzw: quatOf(Vc.cross(F.u, n), F.u, n), width: ED.w, height: ED.h };
  $("dmsg").textContent = "saving…";
  try {
    const r = await fetch("/maps/" + encodeURIComponent(id) + "/anchors/portal", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { let t = "HTTP " + r.status; try { t = (await r.json()).detail || t; } catch (e) {} $("dmsg").textContent = "not saved: " + t; return; }
    endEdit(); $("dmsg").textContent = "saved"; await loadMap(true);
  } catch (e) { $("dmsg").textContent = "not saved: the server did not answer"; }
};

// ---------------------------------------------------------------- scan quality of the selected room
let scanKey = "";
const VERDICT = { good: ["good", "✓", "good scan"], limited: ["warning", "▲", "limited scan"], rescan: ["critical", "✕", "scan again"] };
async function loadScan() {
  const m = mapRow();
  if (!m || !m.scan) { $("scanq").hidden = true; scanKey = ""; return; }
  const key = m.map_id + "|" + m.created_utc + "|" + m.scan.verdict + "|" + m.scan.summary;
  if (key === scanKey) return;
  scanKey = key; renderScan(m.scan);
  try {
    const r = await fetch("/maps/" + encodeURIComponent(m.map_id), { cache: "no-store" });
    const j = r.ok ? await r.json() : null;
    if (j && j.scan_quality && scanKey === key) renderScan(j.scan_quality);
  } catch (e) {}
}
function renderScan(q) {
  const box = $("scanq"), head = el("div", "head"), v = VERDICT[q.verdict] || ["idle", "○", q.verdict || "not judged"];
  head.append(el("b", "", "Scan quality"), chip(...v), el("span", "ink2", q.summary || ""));
  box.replaceChildren(head);
  (q.issues || []).forEach(i => {
    const d = el("div", "issue");
    if (typeof i === "string") d.append(el("span", "mono", i));  // the short row has the codes only
    else { d.append(el("div", "", i.text || i.code)); if (i.do) d.append(el("div", "ink2", "What to do: " + i.do)); d.title = i.code + (i.value != null ? ": " + i.value + " (limit " + i.limit + ")" : ""); }
    box.append(d);
  });
  const mo = q.motion, wa = q.walls, fr = q.frames, pct = x => x == null ? "–" : Math.round(x * 100) + " %";
  if (mo || wa || fr) {
    const dl = el("dl", "kv");
    if (mo && mo.footprint_m) kv(dl, "Walked over", mo.footprint_m.map(x => x.toFixed(1)).join(" × ") + " m");
    if (mo && mo.pitch_deg) kv(dl, "Phone tilt", "from " + num(mo.pitch_deg.lowest, 0) + "° to " + num(mo.pitch_deg.highest, 0) + "° (median " + num(mo.pitch_deg.median, 0) + "°)");
    if (mo && mo.repeated_share != null) kv(dl, "Repeated views", pct(mo.repeated_share));
    if (wa && wa.walls_seen_share != null) kv(dl, "Walls seen", pct(wa.walls_seen_share) + (wa.least_seen_wall_share != null ? " (least seen wall " + pct(wa.least_seen_wall_share) + ")" : ""));
    if (fr && fr.selected) kv(dl, "Frames in the map", fr.in_map + " of " + fr.selected + " (" + pct(fr.share) + ")");
    box.append(dl);
  }
  box.hidden = false;
}

// ---------------------------------------------------------------- main loop
let fails = 0, tick = 0, lastAnswer = 0, startedAt = 0;
// The strip under the title: is the server running, since when, what to type into the phone, who is connected, is a map being built.
function renderStatus(up) {
  const box = $("status"), title = $("st-title"), facts = $("st-facts"); facts.replaceChildren();
  const fact = (label, value) => { const s = el("span"); s.append(label + " ", value instanceof Node ? value : el("b", "", value)); facts.append(s); };
  if (!up) {
    box.className = lastAnswer ? "down" : "wait";
    title.textContent = lastAnswer ? "Server is not running" : "Connecting to the server…";
    if (lastAnswer) {
      fact("Last answer", fmtTime(lastAnswer).slice(0, 8));
      facts.append(el("span", "", "Start it again with “Start AR Portal Server” (double click). This page shows the last known state and comes back by itself."));
    }
    return;
  }
  const s = S.server;
  box.className = "up"; title.textContent = "Server is running";
  fact("since", fmtTime(Date.now() - s.uptime_s * 1000).slice(0, 5) + " (" + dur(s.uptime_s) + ")");
  if (s.urls.length) {
    const a = el("span", "mono", s.urls.join("   or   ")), b = el("button", "", "Copy");
    b.onclick = () => navigator.clipboard && navigator.clipboard.writeText(s.urls[0]);
    const w = el("span"); w.append(a, " ", b); fact("Address for the phone:", w);
  } else fact("Address for the phone:", "none - this PC is not on a network");
  const on = (S.devices || []).filter(d => d.online && d.identified).length;  // the app names itself; a browser or a script does not count
  fact("Phones connected now:", String(on));
  const job = (S.jobs || []).find(j => j.state === "running"), queued = (S.jobs || []).filter(j => j.state === "queued").length;
  fact("Map build:", job ? job.map_id + " - " + (job.stage || "starting") + ", " + Math.round(job.progress * 100) + " %"
    + (job.eta_s ? ", about " + dur(job.eta_s) + " left" : "") + (queued ? " (+" + queued + " waiting)" : "") : queued ? queued + " waiting" : "none");
}
async function refresh() {
  try {
    const r = await fetch("/monitor/state" + (selDev ? "?device=" + encodeURIComponent(selDev) : ""), { cache: "no-store" }); if (!r.ok) throw new Error(r.status);
    const fresh = await r.json(), began = Date.now() - fresh.server.uptime_s * 1000;
    if (startedAt && began - startedAt > 5000) { location.reload(); return; }  // the server was started anew: begin with a clean page
    S = fresh; startedAt = startedAt || began; fails = 0; lastAnswer = Date.now();
    $("live").className = "chip good"; $("live").lastChild.textContent = "live";
    renderStatus(true); renderFlow(S.flow); renderServer(S.server); renderDevices(S.devices); renderMaps(S.maps); renderJobs(S.jobs); renderLocs(S.localizations);
    await pollFeed();
    await loadMap(tick++ % 15 === 0 && !mapData);
  } catch (e) {
    if (++fails >= 2) { renderStatus(false); $("live").className = "chip critical"; $("live").lastChild.textContent = "no answer"; $("hdr").textContent = lastAnswer ? "not running" : "connecting…"; }
  }
  setTimeout(refresh, 1000);
}
// optional start-up choices in the address: /ui#view=3d&theme=dark&map=<map id>&device=<device id>
(function fromAddress() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("theme") === "dark" || h.get("theme") === "light") document.documentElement.dataset.theme = h.get("theme");
  if (h.get("view") === "3d") { view.yaw = -0.6; view.tilt = 0.95; view.mode3d = true; setMode(); }
  if (h.get("map")) { selMap = h.get("map"); pickedMap = true; }
  if (h.get("device")) selDev = h.get("device");
})();
rebuildLogs(); refresh();
</script>
